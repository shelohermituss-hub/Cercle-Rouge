name: Android

on:
  push:
    paths: ["android/**", "tools/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "tools/**", ".github/workflows/android.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # ktlint, tests unitaires, Lint (erreurs bloquantes), interdiction de `!!`, traductions FR/HT/EN
      - run: ./gradlew check --continue
      # Le build release (R8, ressources réduites) doit aussi passer
      - run: ./gradlew assembleRelease
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: rapports
          path: android/**/build/reports/

  pins:
    # L'épinglage TLS correspond-il toujours à la chaîne réelle de Supabase ? (R-NET-07)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: tools/check-pins.sh

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recherche de secrets (gitleaks)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.3 detect --source /repo --redact --verbose
